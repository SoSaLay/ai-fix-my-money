    </g>
    <text x="720" y="312" font-size="13" font-weight="600" fill="#2d2f33">Allocation</text>

    <!-- Donut chart — moved up slightly -->
    <circle cx="792" cy="382" r="52" fill="none" stroke="#f0f0f6" stroke-width="16"/>
    <circle cx="792" cy="382" r="52" fill="none" stroke="#4c49c9" stroke-width="16"
      stroke-dasharray="130 327" stroke-dashoffset="50" stroke-linecap="round"/>
    <circle cx="792" cy="382" r="52" fill="none" stroke="#1a6b3a" stroke-width="16"
      stroke-dasharray="65 327" stroke-dashoffset="-80" stroke-linecap="round"/>
    <circle cx="792" cy="382" r="52" fill="none" stroke="#ff9817" stroke-width="16"
      stroke-dasharray="32 327" stroke-dashoffset="-145" stroke-linecap="round"/>
    <text x="792" y="377" font-size="15" font-weight="700" fill="#2d2f33" text-anchor="middle">70%</text>
    <text x="792" y="393" font-size="9" fill="#acadb1" text-anchor="middle">allocated</text>

    <!-- Legend — well below donut -->
    <circle cx="722" cy="458" r="5" fill="#4c49c9"/>
    <text x="732" y="462" font-size="9.5" fill="#5a5b60">Spending</text>
    <circle cx="722" cy="476" r="5" fill="#1a6b3a"/>
    <text x="732" y="480" font-size="9.5" fill="#5a5b60">Savings</text>
    <circle cx="722" cy="494" r="5" fill="#ff9817"/>
    <text x="732" y="498" font-size="9.5" fill="#5a5b60">Investing</text>

    <!-- Recent Activity card — 4 transactions -->
    <g filter="url(#cardShadow)">
      <rect x="904" y="286" width="218" height="220" rx="16" fill="#fff"/>
    </g>
    <text x="928" y="314" font-size="13" font-weight="600" fill="#2d2f33">Recent Activity</text>

    <!-- Transaction 1 -->
    <line x1="920" y1="328" x2="1106" y2="328" stroke="#f0f0f6" stroke-width="1"/>
    <circle cx="934" cy="348" r="11" fill="rgba(26,107,58,0.1)"/>
    <text x="934" y="352" font-size="9" fill="#1a6b3a" text-anchor="middle">$</text>
    <text x="950" y="346" font-size="10" font-weight="500" fill="#2d2f33">Direct Deposit</text>
    <text x="950" y="358" font-size="9" fill="#acadb1">Income</text>
    <text x="1106" y="350" font-size="11" font-weight="600" fill="#1a6b3a" text-anchor="end">+$9,650</text>

    <!-- Transaction 2 -->
    <line x1="920" y1="372" x2="1106" y2="372" stroke="#f0f0f6" stroke-width="1"/>
    <circle cx="934" cy="392" r="11" fill="rgba(76,73,201,0.1)"/>
    <text x="934" y="396" font-size="9" fill="#4c49c9" text-anchor="middle">🏠</text>
    <text x="950" y="390" font-size="10" font-weight="500" fill="#2d2f33">Rent Payment</text>
    <text x="950" y="402" font-size="9" fill="#acadb1">Housing</text>
    <text x="1106" y="394" font-size="11" font-weight="600" fill="#5a5b60" text-anchor="end">-$3,800</text>

    <!-- Transaction 3 -->
    <line x1="920" y1="416" x2="1106" y2="416" stroke="#f0f0f6" stroke-width="1"/>
    <circle cx="934" cy="436" r="11" fill="rgba(255,152,23,0.1)"/>
    <text x="934" y="440" font-size="9" fill="#ff9817" text-anchor="middle">🛒</text>
    <text x="950" y="434" font-size="10" font-weight="500" fill="#2d2f33">Whole Foods</text>
    <text x="950" y="446" font-size="9" fill="#acadb1">Groceries</text>
    <text x="1106" y="438" font-size="11" font-weight="600" fill="#5a5b60" text-anchor="end">-$186</text>

    <!-- Transaction 4 -->
    <line x1="920" y1="460" x2="1106" y2="460" stroke="#f0f0f6" stroke-width="1"/>
    <circle cx="934" cy="480" r="11" fill="rgba(186,26,26,0.08)"/>
    <text x="934" y="484" font-size="9" fill="#ba1a1a" text-anchor="middle">▶</text>
    <text x="950" y="478" font-size="10" font-weight="500" fill="#2d2f33">Netflix</text>
    <text x="950" y="490" font-size="9" fill="#acadb1">Subscription</text>
    <text x="1106" y="482" font-size="11" font-weight="600" fill="#5a5b60" text-anchor="end">-$22</text>

    <!-- AI Adviser preview strip -->
    <g filter="url(#cardShadow)">
      <rect x="280" y="522" width="614" height="80" rx="16" fill="#fff"/>
    </g>
    <rect x="280" y="522" width="614" height="80" rx="16" fill="rgba(76,73,201,0.03)"/>
    <circle cx="314" cy="562" r="18" fill="rgba(76,73,201,0.12)"/>
    <text x="314" y="567" font-size="14" text-anchor="middle">✦</text>
    <text x="346" y="553" font-size="12" font-weight="600" fill="#2d2f33">AI Adviser</text>
    <text x="346" y="570" font-size="10.5" fill="#5a5b60">Based on your data, you could save an extra $1,240/mo by cutting variable spending by 12%.</text>
    <text x="346" y="588" font-size="10" fill="#4c49c9" font-weight="500">Ask a follow-up →</text>

    <!-- Savings Goals strip -->
    <g filter="url(#cardShadow)">
      <rect x="904" y="522" width="218" height="80" rx="16" fill="#fff"/>
    </g>
    <text x="928" y="546" font-size="12" font-weight="600" fill="#2d2f33">Savings Goals</text>
    <text x="928" y="564" font-size="10" fill="#5a5b60">Emergency Fund</text>
    <rect x="928" y="569" width="166" height="5" rx="2.5" fill="#f0f0f6"/>
    <rect x="928" y="569" width="113" height="5" rx="2.5" fill="#1a6b3a"/>
    <text x="1094" y="573" font-size="9" fill="#1a6b3a" text-anchor="end">68%</text>
    <text x="928" y="589" font-size="10" fill="#5a5b60">Vacation Fund</text>
    <rect x="928" y="594" width="166" height="5" rx="2.5" fill="#f0f0f6"/>
    <rect x="928" y="594" width="60" height="5" rx="2.5" fill="#4c49c9"/>
    <text x="1094" y="598" font-size="9" fill="#4c49c9" text-anchor="end">36%</text>

  </g>

  <!-- Bottom label — app name only, no localhost -->
  <text x="600" y="732" font-size="13" fill="#acadb1" text-anchor="middle" letter-spacing="0.3">AI Fix My Money · Local-first AI finance dashboard</text>
</svg>
