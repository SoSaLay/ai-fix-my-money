<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f5ff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c7ae8"/>
      <stop offset="100%" stop-color="#ff9817" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c49c9"/>
      <stop offset="100%" stop-color="#6b69e0"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6b3a"/>
      <stop offset="100%" stop-color="#2d9955"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9817"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="outerShadow">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#4c49c9" flood-opacity="0.15"/>
    </filter>
    <clipPath id="browserClip">
      <rect x="60" y="40" width="1080" height="670" rx="16"/>
    </clipPath>
  </defs>

  <!-- Outer background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="100" cy="100" r="180" fill="#4c49c9" opacity="0.04"/>
  <circle cx="1100" cy="650" r="200" fill="#ff9817" opacity="0.05"/>
  <circle cx="1050" cy="80" r="120" fill="#1a6b3a" opacity="0.04"/>

  <!-- Browser window -->
  <g filter="url(#outerShadow)">
    <rect x="60" y="40" width="1080" height="670" rx="16" fill="#fff"/>
  </g>

  <!-- Browser chrome bar -->
  <rect x="60" y="40" width="1080" height="42" rx="16" fill="#ececec"/>
  <rect x="60" y="66" width="1080" height="16" fill="#ececec"/>

  <!-- Traffic lights -->
  <circle cx="92" cy="61" r="6" fill="#ff5f57"/>
  <circle cx="112" cy="61" r="6" fill="#ffbd2e"/>
  <circle cx="132" cy="61" r="6" fill="#28c840"/>

  <!-- URL bar -->
  <rect x="280" y="50" width="420" height="22" rx="11" fill="#fff" opacity="0.7"/>
  <text x="490" y="65" font-size="11" fill="#888" text-anchor="middle">localhost:3000/dashboard</text>

  <!-- App content clipped -->
  <g clip-path="url(#browserClip)">

    <!-- Main app background -->
    <rect x="60" y="82" width="1080" height="628" fill="#f6f6fb"/>

    <!-- ── SIDEBAR ── -->
    <rect x="60" y="82" width="200" height="628" fill="#fff"/>
    <line x1="260" y1="82" x2="260" y2="710" stroke="#e7e8ee" stroke-width="1"/>

    <!-- Brand -->
    <text x="82" y="122" font-size="13" font-weight="700" fill="#2d2f33" letter-spacing="-0.2">AI Fix My Money</text>
    <text x="82" y="137" font-size="9" fill="#acadb1" letter-spacing="1.5">AI FINANCE</text>

    <!-- Tutorial nav item -->
    <rect x="70" y="150" width="178" height="34" rx="10" fill="transparent"/>
    <text x="96" y="172" font-size="11.5" fill="#acadb1" font-weight="500">📖  Tutorial</text>

    <!-- Divider -->
    <line x1="82" y1="194" x2="242" y2="194" stroke="#e7e8ee" stroke-width="1"/>

    <!-- Dashboard (active) -->
    <rect x="70" y="202" width="178" height="34" rx="10" fill="rgba(76,73,201,0.10)"/>
    <text x="96" y="224" font-size="11.5" fill="#4c49c9" font-weight="600">▦  Dashboard</text>

    <!-- Accounts -->
    <rect x="70" y="242" width="178" height="34" rx="10" fill="transparent"/>
    <text x="96" y="264" font-size="11.5" fill="#acadb1" font-weight="500">💳  Accounts</text>

    <!-- Spending -->
    <rect x="70" y="280" width="178" height="34" rx="10" fill="transparent"/>
    <text x="96" y="302" font-size="11.5" fill="#acadb1" font-weight="500">◔  Spending</text>

    <!-- Savings -->
    <rect x="70" y="318" width="178" height="34" rx="10" fill="transparent"/>
    <text x="96" y="340" font-size="11.5" fill="#acadb1" font-weight="500">🐷  Savings</text>

    <!-- Investing -->
    <rect x="70" y="356" width="178" height="34" rx="10" fill="transparent"/>
    <text x="96" y="378" font-size="11.5" fill="#acadb1" font-weight="500">↗  Investing</text>

    <!-- AI Adviser -->
    <rect x="70" y="394" width="178" height="34" rx="10" fill="transparent"/>
    <text x="96" y="416" font-size="11.5" fill="#acadb1" font-weight="500">✦  AI Adviser</text>

    <!-- Bottom sidebar -->
    <rect x="70" y="640" width="178" height="34" rx="10" fill="transparent"/>
    <text x="96" y="662" font-size="11.5" fill="#acadb1" font-weight="500">↑  Import Data</text>
    <rect x="70" y="676" width="178" height="30" rx="10" fill="transparent"/>
    <text x="96" y="696" font-size="11.5" fill="#e57373" font-weight="500">🗑  Clear Data</text>

    <!-- ── MAIN CONTENT ── -->

    <!-- Top nav bar -->
    <rect x="260" y="82" width="880" height="60" fill="#fff"/>
    <line x1="260" y1="142" x2="1140" y2="142" stroke="#e7e8ee" stroke-width="1"/>
    <text x="288" y="118" font-size="18" font-weight="700" fill="#2d2f33">Dashboard</text>
    <circle cx="1110" cy="112" r="18" fill="#e7e8ee"/>
    <text x="1110" y="117" font-size="11" fill="#5a5b60" text-anchor="middle" font-weight="600">U</text>

    <!-- ── METRIC CARDS ── -->
    <!-- Net Cash Flow -->
    <g filter="url(#cardShadow)">
      <rect x="280" y="158" width="260" height="110" rx="16" fill="url(#cardGrad1)"/>
    </g>
    <text x="304" y="185" font-size="10" fill="rgba(255,255,255,0.75)" letter-spacing="0.5">NET CASH FLOW</text>
    <text x="304" y="218" font-size="28" font-weight="700" fill="#fff">+$5,820</text>
    <text x="304" y="240" font-size="11" fill="rgba(255,255,255,0.7)">↑ 14% vs last month</text>
    <rect x="304" y="252" width="60" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="304" y="252" width="44" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>

    <!-- Monthly Income -->
    <g filter="url(#cardShadow)">
      <rect x="556" y="158" width="260" height="110" rx="16" fill="url(#cardGrad2)"/>
    </g>
    <text x="580" y="185" font-size="10" fill="rgba(255,255,255,0.75)" letter-spacing="0.5">MONTHLY INCOME</text>
    <text x="580" y="218" font-size="28" font-weight="700" fill="#fff">$19,300</text>
    <text x="580" y="240" font-size="11" fill="rgba(255,255,255,0.7)">↑ $300 vs last month</text>
    <rect x="580" y="252" width="60" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="580" y="252" width="52" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>

    <!-- Monthly Spending -->
