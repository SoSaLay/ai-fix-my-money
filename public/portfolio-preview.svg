    <text x="324" y="465" font-size="9" fill="#acadb1" text-anchor="middle">Sep</text>
    <rect x="352" y="378" width="32" height="72" rx="5" fill="rgba(76,73,201,0.13)"/>
    <text x="368" y="465" font-size="9" fill="#acadb1" text-anchor="middle">Oct</text>
    <rect x="396" y="408" width="32" height="42" rx="5" fill="rgba(76,73,201,0.13)"/>
