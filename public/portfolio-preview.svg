    <rect x="440" y="362" width="32" height="88" rx="5" fill="rgba(76,73,201,0.13)"/>
    <text x="456" y="465" font-size="9" fill="#acadb1" text-anchor="middle">Dec</text>
    <rect x="484" y="388" width="32" height="62" rx="5" fill="rgba(76,73,201,0.13)"/>
    <text x="500" y="465" font-size="9" fill="#acadb1" text-anchor="middle">Jan</text>
    <rect x="528" y="372" width="32" height="78" rx="5" fill="rgba(76,73,201,0.13)"/>
    <text x="544" y="465" font-size="9" fill="#acadb1" text-anchor="middle">Feb</text>
    <rect x="572" y="395" width="32" height="55" rx="5" fill="rgba(76,73,201,0.13)"/>
    <text x="588" y="465" font-size="9" fill="#acadb1" text-anchor="middle">Mar</text>
    <rect x="616" y="350" width="32" height="100" rx="5" fill="url(#barGrad)"/>
    <text x="632" y="465" font-size="9" fill="#4c49c9" font-weight="600" text-anchor="middle">Apr</text>

