      <rect x="832" y="158" width="260" height="110" rx="16" fill="url(#cardGrad3)"/>
    </g>
    <text x="856" y="185" font-size="10" fill="rgba(255,255,255,0.75)" letter-spacing="0.5">MONTHLY SPENDING</text>
    <text x="856" y="218" font-size="28" font-weight="700" fill="#fff">$13,480</text>
    <text x="856" y="240" font-size="11" fill="rgba(255,255,255,0.7)">↓ 8% vs last month</text>
