<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">Growth only overtakes deposits with time</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">$300 a month at an assumed 7% a year. Illustration only.</text>

  <rect x="40" y="100" width="14" height="14" rx="4" fill="#c9c9de"/>
  <text x="62" y="112" fill="#5a5b60" font-size="12.5">What you put in</text>
  <rect x="176" y="100" width="14" height="14" rx="4" fill="#4c49c9"/>
  <text x="198" y="112" fill="#5a5b60" font-size="12.5">Growth on top</text>

  <line x1="40" y1="348" x2="600" y2="348" stroke="#e3e3ec" stroke-width="1.5"/>

  <rect x="86" y="290" width="86" height="58" rx="6" fill="#c9c9de"/>
  <rect x="86" y="278" width="86" height="12" rx="6" fill="#4c49c9"/>
  <text x="129" y="372" fill="#2d2f33" font-size="13.5" font-weight="700" text-anchor="middle">Year 5</text>
  <text x="129" y="392" fill="#5a5b60" font-size="12" text-anchor="middle">$18,000 in</text>
  <text x="129" y="410" fill="#5a5b60" font-size="12" text-anchor="middle">$3,500 growth</text>

  <rect x="277" y="208" width="86" height="140" rx="6" fill="#c9c9de"/>
  <rect x="277" y="160" width="86" height="52" rx="6" fill="#4c49c9"/>
  <text x="320" y="372" fill="#2d2f33" font-size="13.5" font-weight="700" text-anchor="middle">Year 15</text>
  <text x="320" y="392" fill="#5a5b60" font-size="12" text-anchor="middle">$54,000 in</text>
  <text x="320" y="410" fill="#5a5b60" font-size="12" text-anchor="middle">$41,000 growth</text>

  <rect x="468" y="252" width="86" height="96" rx="6" fill="#c9c9de"/>
  <rect x="468" y="132" width="86" height="126" rx="6" fill="#4c49c9"/>
  <text x="511" y="372" fill="#2d2f33" font-size="13.5" font-weight="700" text-anchor="middle">Year 30</text>
  <text x="511" y="392" fill="#5a5b60" font-size="12" text-anchor="middle">$108,000 in</text>
  <text x="511" y="410" fill="#5a5b60" font-size="12" text-anchor="middle">$258,000 growth</text>

  <rect x="40" y="430" width="560" height="34" rx="10" fill="#f0f0f6"/>
  <text x="60" y="452" fill="#5a5b60" font-size="12.5">A 50% fall needs a 100% gain just to get back to where it was.</text>
</svg>
