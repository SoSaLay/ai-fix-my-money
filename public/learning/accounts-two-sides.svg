<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">Every account sits on one side</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">The word “balance” means the opposite thing on each.</text>

  <rect x="40" y="106" width="256" height="316" rx="20" fill="#f0f0f6"/>
  <rect x="40" y="106" width="256" height="6" rx="3" fill="#1a6b3a"/>
  <text x="64" y="146" fill="#1a6b3a" font-size="11" font-weight="600" letter-spacing="1.4">ASSET ACCOUNTS</text>
  <text x="64" y="174" fill="#2d2f33" font-size="16" font-weight="600">What you own</text>
  <text x="64" y="197" fill="#5a5b60" font-size="13">Balance = money you hold</text>
  <g fill="#ffffff">
    <rect x="64" y="218" width="208" height="42" rx="12"/>
    <rect x="64" y="268" width="208" height="42" rx="12"/>
    <rect x="64" y="318" width="208" height="42" rx="12"/>
    <rect x="64" y="368" width="208" height="42" rx="12"/>
  </g>
  <g font-size="13" fill="#2d2f33">
    <text x="84" y="244">Checking</text>
    <text x="84" y="294">Savings</text>
    <text x="84" y="344">Brokerage</text>
    <text x="84" y="394">Retirement</text>
  </g>
  <g font-size="13" fill="#1a6b3a" text-anchor="end" font-weight="600">
    <text x="252" y="244">+ $1,240</text>
    <text x="252" y="294">+ $3,000</text>
    <text x="252" y="344">+ $820</text>
    <text x="252" y="394">+ $6,410</text>
  </g>

  <rect x="344" y="106" width="256" height="316" rx="20" fill="#f0f0f6"/>
  <rect x="344" y="106" width="256" height="6" rx="3" fill="#ff9817"/>
  <text x="368" y="146" fill="#b56600" font-size="11" font-weight="600" letter-spacing="1.4">LIABILITY ACCOUNTS</text>
  <text x="368" y="174" fill="#2d2f33" font-size="16" font-weight="600">What you owe</text>
  <text x="368" y="197" fill="#5a5b60" font-size="13">Balance = money still to repay</text>
  <g fill="#ffffff">
    <rect x="368" y="218" width="208" height="42" rx="12"/>
    <rect x="368" y="268" width="208" height="42" rx="12"/>
    <rect x="368" y="318" width="208" height="42" rx="12"/>
    <rect x="368" y="368" width="208" height="42" rx="12"/>
  </g>
  <g font-size="13" fill="#2d2f33">
    <text x="388" y="244">Credit card</text>
    <text x="388" y="294">Student loan</text>
    <text x="388" y="344">Auto loan</text>
    <text x="388" y="394">Mortgage</text>
  </g>
  <g font-size="13" fill="#ba1a1a" text-anchor="end" font-weight="600">
    <text x="556" y="244">− $840</text>
    <text x="556" y="294">− $18,200</text>
    <text x="556" y="344">− $9,050</text>
    <text x="556" y="394">− $214,000</text>
  </g>

  <text x="320" y="452" fill="#5a5b60" font-size="13" text-anchor="middle">Adding the two columns together produces a meaningless number.</text>
</svg>
