<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">Three balances, one account</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">They rarely match, and only one is spendable today.</text>

  <text x="40" y="128" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.3">CURRENT BALANCE</text>
  <rect x="40" y="140" width="480" height="46" rx="12" fill="#cfcdff"/>
  <text x="60" y="169" fill="#2d2f33" font-size="15" font-weight="600">$1,200.00</text>
  <text x="500" y="169" fill="#5a5b60" font-size="12.5" text-anchor="end">what the ledger says right now</text>

  <text x="40" y="226" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.3">PENDING, NOT YET SETTLED</text>
  <rect x="40" y="238" width="132" height="46" rx="12" fill="#ff9817" opacity="0.35"/>
  <text x="60" y="267" fill="#2d2f33" font-size="15" font-weight="600">− $150.00</text>
  <text x="192" y="260" fill="#5a5b60" font-size="12.5">card taps and holds the bank has seen</text>
  <text x="192" y="278" fill="#5a5b60" font-size="12.5">but not yet taken out</text>

  <text x="40" y="324" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.3">AVAILABLE BALANCE</text>
  <rect x="40" y="336" width="420" height="46" rx="12" fill="#4c49c9"/>
  <text x="60" y="365" fill="#ffffff" font-size="15" font-weight="600">$1,050.00</text>
  <text x="440" y="365" fill="#ffffff" font-size="12.5" text-anchor="end" opacity="0.85">the only one you can actually spend</text>

  <line x1="40" y1="408" x2="600" y2="408" stroke="#acadb1" stroke-width="1" opacity="0.5"/>
  <text x="40" y="436" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.3">STATEMENT BALANCE</text>
  <text x="220" y="437" fill="#2d2f33" font-size="13">$840.00 — frozen at the closing date, not today’s number.</text>
</svg>
