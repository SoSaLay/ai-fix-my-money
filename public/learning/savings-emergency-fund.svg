<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">An emergency fund is measured in months</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">Not in dollars. The unit is “months of your own essential costs”.</text>

  <rect x="40" y="108" width="520" height="66" rx="16" fill="#f0f0f6"/>
  <text x="64" y="138" fill="#5a5b60" font-size="12.5">Essential monthly costs</text>
  <text x="64" y="162" fill="#2d2f33" font-size="16" font-weight="700">$1,880</text>
  <text x="536" y="138" fill="#5a5b60" font-size="12.5" text-anchor="end">Saved so far</text>
  <text x="536" y="162" fill="#2d2f33" font-size="16" font-weight="700" text-anchor="end">$5,640</text>

  <text x="40" y="212" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.3">MONTHS COVERED — 3 OF 6</text>

  <g>
    <rect x="40" y="226" width="78" height="72" rx="12" fill="#4c49c9"/>
    <rect x="128" y="226" width="78" height="72" rx="12" fill="#4c49c9"/>
    <rect x="216" y="226" width="78" height="72" rx="12" fill="#4c49c9"/>
    <rect x="304" y="226" width="78" height="72" rx="12" fill="#e7e8ee"/>
    <rect x="392" y="226" width="78" height="72" rx="12" fill="#e7e8ee"/>
    <rect x="480" y="226" width="78" height="72" rx="12" fill="#e7e8ee"/>
  </g>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <text x="79" y="268" fill="#ffffff">1</text>
    <text x="167" y="268" fill="#ffffff">2</text>
    <text x="255" y="268" fill="#ffffff">3</text>
    <text x="343" y="268" fill="#acadb1">4</text>
    <text x="431" y="268" fill="#acadb1">5</text>
    <text x="519" y="268" fill="#acadb1">6</text>
  </g>

  <rect x="40" y="326" width="520" height="118" rx="18" fill="#f0f0f6"/>
  <text x="64" y="358" fill="#2d2f33" font-size="14" font-weight="600">Why the unit matters</text>
  <text x="64" y="386" fill="#5a5b60" font-size="13">$5,640 means nothing until you know what a month costs you. The same</text>
  <text x="64" y="407" fill="#5a5b60" font-size="13">balance is nine months for one person and six weeks for another.</text>
  <text x="64" y="430" fill="#5a5b60" font-size="13">Cutting essential costs raises the coverage without saving another cent.</text>
</svg>
