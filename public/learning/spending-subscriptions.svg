<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">Small, recurring, and easy to stop seeing</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">Each one is priced to be ignorable on its own. The annual column is the honest one.</text>

  <text x="40" y="118" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.2">SERVICE</text>
  <text x="400" y="118" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.2" text-anchor="end">PER MONTH</text>
  <text x="560" y="118" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.2" text-anchor="end">PER YEAR</text>

  <g font-size="13.5">
    <rect x="40" y="130" width="520" height="40" rx="10" fill="#f0f0f6"/>
    <text x="60" y="155" fill="#2d2f33">Streaming video</text>
    <text x="400" y="155" fill="#5a5b60" text-anchor="end">$15.99</text>
    <text x="560" y="155" fill="#2d2f33" text-anchor="end" font-weight="600">$191.88</text>

    <rect x="40" y="178" width="520" height="40" rx="10" fill="#f0f0f6"/>
    <text x="60" y="203" fill="#2d2f33">Music</text>
    <text x="400" y="203" fill="#5a5b60" text-anchor="end">$10.99</text>
    <text x="560" y="203" fill="#2d2f33" text-anchor="end" font-weight="600">$131.88</text>

    <rect x="40" y="226" width="520" height="40" rx="10" fill="#f0f0f6"/>
    <text x="60" y="251" fill="#2d2f33">Cloud storage</text>
    <text x="400" y="251" fill="#5a5b60" text-anchor="end">$2.99</text>
    <text x="560" y="251" fill="#2d2f33" text-anchor="end" font-weight="600">$35.88</text>

    <rect x="40" y="274" width="520" height="40" rx="10" fill="#f0f0f6"/>
    <text x="60" y="299" fill="#2d2f33">Gym</text>
    <text x="400" y="299" fill="#5a5b60" text-anchor="end">$34.00</text>
    <text x="560" y="299" fill="#2d2f33" text-anchor="end" font-weight="600">$408.00</text>

    <rect x="40" y="322" width="520" height="40" rx="10" fill="#f0f0f6"/>
    <text x="60" y="347" fill="#2d2f33">Second streaming service</text>
    <text x="400" y="347" fill="#5a5b60" text-anchor="end">$12.99</text>
    <text x="560" y="347" fill="#2d2f33" text-anchor="end" font-weight="600">$155.88</text>
  </g>

  <rect x="40" y="378" width="520" height="50" rx="12" fill="#ff9817" opacity="0.28"/>
  <text x="60" y="408" fill="#2d2f33" font-size="14.5" font-weight="600">Five services</text>
  <text x="400" y="408" fill="#2d2f33" font-size="14" text-anchor="end" font-weight="600">$76.96</text>
  <text x="560" y="408" fill="#2d2f33" font-size="16" text-anchor="end" font-weight="700">$923.52</text>

  <text x="40" y="456" fill="#5a5b60" font-size="12.5">Drift is the gap between what you would guess and what the annual column says.</text>
</svg>
