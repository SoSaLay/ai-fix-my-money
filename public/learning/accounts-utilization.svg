<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">Utilization is a ratio, not an amount</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">Balance divided by limit. The same $1,500 reads differently on a different card.</text>

  <text x="40" y="128" fill="#5a5b60" font-size="12.5">Card A — limit $5,000</text>
  <rect x="40" y="140" width="460" height="40" rx="10" fill="#e7e8ee"/>
  <rect x="40" y="140" width="138" height="40" rx="10" fill="#4c49c9"/>
  <text x="194" y="166" fill="#2d2f33" font-size="14" font-weight="600">$1,500 used</text>
  <text x="600" y="167" fill="#4c49c9" font-size="18" font-weight="700" text-anchor="end">30%</text>

  <text x="40" y="228" fill="#5a5b60" font-size="12.5">Card B — limit $2,000</text>
  <rect x="40" y="240" width="460" height="40" rx="10" fill="#e7e8ee"/>
  <rect x="40" y="240" width="345" height="40" rx="10" fill="#ff9817"/>
  <text x="401" y="266" fill="#2d2f33" font-size="14" font-weight="600">$1,500 used</text>
  <text x="600" y="267" fill="#b56600" font-size="18" font-weight="700" text-anchor="end">75%</text>
</svg>
