<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">The type sets the rules</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">Same institution, different account, different constraints.</text>

  <g>
    <rect x="40" y="104" width="270" height="112" rx="18" fill="#f0f0f6"/>
    <circle cx="68" cy="132" r="5" fill="#1a6b3a"/>
    <text x="84" y="137" fill="#2d2f33" font-size="15" font-weight="600">Checking</text>
    <text x="64" y="164" fill="#5a5b60" font-size="12.5">Everyday in and out. No limit on</text>
    <text x="64" y="183" fill="#5a5b60" font-size="12.5">withdrawals, little or no interest.</text>
    <text x="64" y="203" fill="#4c49c9" font-size="11.5" font-weight="600">ASSET</text>

    <rect x="330" y="104" width="270" height="112" rx="18" fill="#f0f0f6"/>
    <circle cx="358" cy="132" r="5" fill="#1a6b3a"/>
    <text x="374" y="137" fill="#2d2f33" font-size="15" font-weight="600">Savings</text>
    <text x="354" y="164" fill="#5a5b60" font-size="12.5">Held back on purpose. Pays interest,</text>
    <text x="354" y="183" fill="#5a5b60" font-size="12.5">may cap monthly transfers out.</text>
    <text x="354" y="203" fill="#4c49c9" font-size="11.5" font-weight="600">ASSET</text>

    <rect x="40" y="230" width="270" height="112" rx="18" fill="#f0f0f6"/>
    <circle cx="68" cy="258" r="5" fill="#1a6b3a"/>
    <text x="84" y="263" fill="#2d2f33" font-size="15" font-weight="600">Brokerage</text>
    <text x="64" y="290" fill="#5a5b60" font-size="12.5">Holds investments, not cash. The value</text>
    <text x="64" y="309" fill="#5a5b60" font-size="12.5">moves with the market, both ways.</text>
    <text x="64" y="329" fill="#4c49c9" font-size="11.5" font-weight="600">ASSET</text>

    <rect x="330" y="230" width="270" height="112" rx="18" fill="#f0f0f6"/>
    <circle cx="358" cy="258" r="5" fill="#1a6b3a"/>
    <text x="374" y="263" fill="#2d2f33" font-size="15" font-weight="600">Retirement</text>
    <text x="354" y="290" fill="#5a5b60" font-size="12.5">Tax treatment in exchange for rules</text>
    <text x="354" y="309" fill="#5a5b60" font-size="12.5">about when you can take it out.</text>
    <text x="354" y="329" fill="#4c49c9" font-size="11.5" font-weight="600">ASSET</text>

    <rect x="40" y="356" width="270" height="112" rx="18" fill="#f0f0f6"/>
    <circle cx="68" cy="384" r="5" fill="#ff9817"/>
    <text x="84" y="389" fill="#2d2f33" font-size="15" font-weight="600">Credit card</text>
    <text x="64" y="415" fill="#5a5b60" font-size="12.5">Revolving. Borrow up to a limit,</text>
    <text x="64" y="434" fill="#5a5b60" font-size="12.5">repay any amount above the minimum.</text>
    <text x="64" y="457" fill="#b56600" font-size="11.5" font-weight="600">LIABILITY</text>

    <rect x="330" y="356" width="270" height="112" rx="18" fill="#f0f0f6"/>
    <circle cx="358" cy="384" r="5" fill="#ff9817"/>
    <text x="374" y="389" fill="#2d2f33" font-size="15" font-weight="600">Instalment loan</text>
    <text x="354" y="415" fill="#5a5b60" font-size="12.5">Fixed sum, fixed schedule. The balance</text>
    <text x="354" y="434" fill="#5a5b60" font-size="12.5">only goes one way — down.</text>
    <text x="354" y="457" fill="#b56600" font-size="11.5" font-weight="600">LIABILITY</text>
  </g>
</svg>
