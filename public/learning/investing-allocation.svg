<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Inter, system-ui, sans-serif">
  <rect width="640" height="480" fill="#ffffff"/>
  <text x="40" y="52" fill="#2d2f33" font-size="21" font-weight="700">Allocation is the split. Rebalancing restores it.</text>
  <text x="40" y="78" fill="#5a5b60" font-size="14">The market moves the mix on its own. Returning to it is a decision.</text>

  <text x="40" y="122" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.3">THE SPLIT YOU CHOSE</text>
  <g>
    <rect x="40" y="136" width="168" height="44" rx="10" fill="#c9c9de"/>
    <rect x="212" y="136" width="196" height="44" rx="10" fill="#4c49c9"/>
    <rect x="412" y="136" width="72" height="44" rx="10" fill="#7d7bd8"/>
    <rect x="488" y="136" width="112" height="44" rx="10" fill="#a5a3e6"/>
  </g>
  <text x="124" y="200" fill="#5a5b60" font-size="12" text-anchor="middle">Fixed income</text>
  <text x="310" y="200" fill="#5a5b60" font-size="12" text-anchor="middle">Large cap</text>
  <text x="448" y="200" fill="#5a5b60" font-size="12" text-anchor="middle">Mid/small</text>
  <text x="544" y="200" fill="#5a5b60" font-size="12" text-anchor="middle">Foreign</text>

  <text x="40" y="252" fill="#5a5b60" font-size="11.5" font-weight="600" letter-spacing="1.3">A YEAR LATER, AFTER STOCKS RAN UP</text>
  <g>
    <rect x="40" y="266" width="120" height="44" rx="10" fill="#c9c9de"/>
    <rect x="164" y="266" width="276" height="44" rx="10" fill="#4c49c9"/>
    <rect x="444" y="266" width="60" height="44" rx="10" fill="#7d7bd8"/>
    <rect x="508" y="266" width="92" height="44" rx="10" fill="#a5a3e6"/>
  </g>
  <text x="40" y="332" fill="#5a5b60" font-size="12.5">Nothing was bought or sold. Large cap simply grew into a bigger share of the total.</text>

  <rect x="40" y="356" width="560" height="96" rx="16" fill="#f0f0f6"/>
  <circle cx="72" cy="392" r="13" fill="#4c49c9"/>
  <path d="M67 392 a5 5 0 1 1 2 4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="98" y="397" fill="#2d2f33" font-size="15" font-weight="700">Rebalancing</text>
  <text x="68" y="428" fill="#5a5b60" font-size="13">Sell down what grew, top up what lagged, and the split is back where you set it.</text>
</svg>
