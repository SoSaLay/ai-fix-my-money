<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="r5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8d93"/><stop offset="1" stop-color="#b4b7bd"/></linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8fd6"/><stop offset="1" stop-color="#4fc9c0"/></linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a9b5a"/><stop offset="1" stop-color="#a4d13a"/></linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c49c9"/><stop offset="1" stop-color="#ff9817"/></linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset="0.5" stop-color="#ffd27a"/><stop offset="1" stop-color="#7c7ae8"/></linearGradient>
  </defs>

  <ellipse cx="200" cy="336" rx="150" ry="15" fill="#2d2f33" opacity="0.06"/>

  <!-- Five ranks as rising columns, grey to full colour -->
  <g stroke="#2d2f33" stroke-width="3.5" stroke-linejoin="round">
    <rect x="52"  y="266" width="48" height="60"  rx="12" fill="url(#r5)"/>
    <rect x="114" y="226" width="48" height="100" rx="12" fill="url(#r4)"/>
    <rect x="176" y="186" width="48" height="140" rx="12" fill="url(#r3)"/>
    <rect x="238" y="146" width="48" height="180" rx="12" fill="url(#r2)"/>
    <rect x="300" y="100" width="48" height="226" rx="12" fill="url(#r1)"/>
  </g>

  <!-- Rising arrow -->
  <g stroke="#2d2f33" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M70 216 C 130 196, 190 150, 262 96"/>
    <path d="M238 92 L 266 92 L 262 120"/>
  </g>

  <!-- Star over the top rank -->
  <path d="M324 40 l9 20 l22 3 l-16 15 l4 22 l-19 -11 l-19 11 l4 -22 l-16 -15 l22 -3 z"
        fill="#ffd27a" stroke="#2d2f33" stroke-width="3.5" stroke-linejoin="round"/>

  <g fill="#4c49c9">
    <path d="M110 120 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z"/>
  </g>
</svg>
