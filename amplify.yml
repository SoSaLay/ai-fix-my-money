# AWS Amplify Hosting build spec.
#
# Amplify detects Next.js and provisions WEB_COMPUTE — the route handlers and
# server components run on Lambda. Confirm that on the first deploy: a static
# build would drop every /api route without failing loudly.
#
# type-check runs before build so a type error fails in seconds rather than
# after a full compile.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run type-check
        # Console environment variables exist only in this build container, not
        # on the Lambda that serves /api. Writing the two server-side secrets to
        # .env.production is how Amplify makes them reachable at runtime. The
        # file is gitignored and never echoed to the build log.
        - env | grep -E '^(ANTHROPIC_API_KEY|QUIZ_ATTEMPT_SECRET)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
